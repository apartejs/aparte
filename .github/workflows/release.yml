name: release

# Publishes the version main carries once main's CI is green on that commit — what
# `pnpm release` did from a maintainer's machine, without waiting for someone to say the
# run is green. The version commit is made as before (`pnpm version-packages`, in the PR);
# merging it is the trigger.
#
# Most runs stop at the first step: a commit that is not a version commit carries a
# version npm already has. The manual path (CONTRIBUTING → Releasing) still works and
# meets this one without harm: whichever publishes first, the other finds the version on
# npm and does nothing.
#
# Needs the repository secret NPM_TOKEN: an npm granular access token with read and write
# on the @aparte packages, allowed to bypass two-factor authentication (CI cannot type a
# code). When it expires, the publish step says so in its error.
on:
  workflow_run:
    workflows: [ ci ]
    types: [ completed ]
    branches: [ main ]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # A green run of a push to main only: never a pull request's, never a red one.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the tags
      id-token: write        # sign the provenance of what is published
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The commit CI judged, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Is this version on npm yet?
        id: version
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if npm view "@aparte/core@$version" version > /dev/null 2>&1; then
            echo "@aparte/core@$version is on npm already: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "@aparte/core@$version is not on npm: releasing it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.version.outputs.release == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Use Node.js
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        if: steps.version.outputs.release == 'true'
        run: pnpm -r --filter "./packages/**" run build

      - name: Publish, align the dist-tags, tag the release
        if: steps.version.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set: nothing was published."
            exit 1
          fi
          if ! npm whoami > /dev/null 2>&1; then
            echo "::error::npm refused NPM_TOKEN (expired or revoked?): nothing was published. Create a new granular token and update the secret."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm changeset publish --tag beta
          node scripts/align-dist-tags.mjs
          node scripts/tag-release.mjs

      # The release tag alone, then the packages' — GitHub drops a tag-push event past
      # three tags in one push. A tag pushed with this job's token triggers no workflow,
      # so the Release is made by the job below, not by release-notes' tag trigger.
      - name: Push the tags
        if: steps.version.outputs.release == 'true'
        run: |
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"
          git push origin $(git tag --points-at HEAD | grep '^@aparte/' | sed 's|^|refs/tags/|')

  notes:
    needs: publish
    if: needs.publish.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
