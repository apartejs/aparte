name: release

# Opens/updates a single "Version Packages" PR that aggregates all pending
# changesets (running `changeset version`): merging it bumps versions + writes
# changelogs. Publishing to npm is deliberately NOT automated here — it stays a
# manual `pnpm release` (or add a `publish:` step + an NPM_TOKEN secret when you
# want CI to publish). For the first ALPHA, run `pnpm changeset pre enter alpha`
# first so the versions resolve to `-alpha.N` rather than a stable bump.
on:
  push:
    branches: [ main ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # commit the version bump on the PR branch
  pull-requests: write   # open/update the Version Packages PR

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # KNOWN GAP, stated rather than left to be discovered.
      #
      # This PR is authored by `GITHUB_TOKEN`, and GitHub does not start workflow
      # runs from events its own token creates. So `ci` never runs on the Version
      # PR: a `changeset version` that produced a broken `package.json` (an
      # unresolved `workspace:*`, a malformed changelog) is only validated AFTER it
      # merges to main.
      #
      # The fix needs a credential this workflow cannot mint: set `RELEASE_PR_TOKEN`
      # to a PAT or a GitHub App installation token and swap it in below, and the PR
      # starts triggering CI like any other. Until then the version bump is reviewed
      # by a human and validated post-merge, which is the actual current guarantee.
      #
      # `pnpm release` refuses to publish from a dirty tree, off `main`, or out of
      # sync with origin (scripts/prerelease-checks.mjs) and runs the full gate
      # first, so a bad bump cannot reach npm through the manual path either.
      #
      # NO PROVENANCE, and that is now stated instead of claimed. An earlier attempt
      # passed `--provenance` to `changeset publish`; a follow-up audit found the word
      # appears ZERO times in @changesets/cli@2.31.0 — meow swallows the unknown flag
      # and it never reaches `npm publish`. Setting `publishConfig.provenance` instead
      # would not help either: npm only mints an attestation inside a supported CI with
      # `id-token: write`, and it FAILS outside one, which would break the manual path
      # this repo deliberately uses. Real provenance therefore requires the publish to
      # move into a tag-triggered job here, with `id-token: write` — the same change
      # the note above describes for the Version PR. Until then: no attestation, said
      # plainly rather than advertised.
      - name: Create/update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
