name: release-notes

# Turns a pushed umbrella tag into the GitHub Release for that version.
#
# Every `@aparte/*` package ships at one version (`fixed` in
# .changeset/config.json), so a release has a single identity: `v0.4.0-alpha.0`.
# `changeset publish` also tags each package individually — those are ignored here
# on purpose, one Release per version rather than fifteen.
#
# The body is the matching section of the root CHANGELOG.md, i.e. exactly what was
# committed with the version bump. No install step: the extractor is dependency-free
# and the runner already has Node.
#
# The work is `scripts/create-release.mjs`, which `ci.yml`'s release job also runs: a tag
# pushed with a workflow's own token triggers no workflow, so this one only sees the tags a
# maintainer pushes by hand.
on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: release-notes-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the Release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-release.mjs
