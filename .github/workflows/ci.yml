name: ci

on:
  # `next` is the integration branch between two publishes (0.15.0 → 0.16.0): a feature
  # PR targets it, and it merges into `main` only at the next release. Without it here a
  # PR into `next` was judged by nothing — found the day the branch was created.
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

# A superseded push cancels its in-flight run instead of queuing — on `main` too.
#
# `main` used to be keyed by the unique SHA so every commit got its own verified
# run. That reads well and costs badly: merging three PRs inside two minutes (a
# fix, then the version PR, then the release) started three full runs — ci +
# node-floor + e2e, about fifteen minutes of runner each — for one state anyone
# would actually look at. The tail run verifies the tree the earlier ones were
# heading towards anyway.
#
# The trade is explicit: an intermediate `main` commit can now go unverified if a
# newer one lands while it runs. Acceptable here because releases arrive in
# bursts and `pnpm release` runs the whole gate locally before publishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The changeset guard below needs a MERGE BASE, and a shallow clone has
          # none: `changeset status --since` died with "Failed to find where HEAD
          # diverged from origin/main" on the first pull request this repo ever had.
          # The guard could never have worked — it is PR-only, and there had been no
          # PR. Full history for this job only; the others do not diff against a base.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        # version is read from the packageManager field in package.json

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Test files are excluded from every package's build tsconfig (they must not
      # ship in dist), which left them unchecked by `tsc` entirely. This pass puts
      # them in a type program — and covers the `.svelte` components, which plain
      # tsc never parses.
      - name: Typecheck tests
        run: pnpm typecheck:tests

      # Both React majors the wrapper's peer range advertises. Developing against
      # one only is how the React 19 JSX augmentation shipped broken.
      - name: Typecheck type matrix
        run: pnpm typecheck:matrix

      - name: Build
        run: pnpm build

      # Publish-safety: publint (all 15 packages) + are-the-types-wrong (the 12
      # non-SFC/APF packages; angular/svelte/vue carry an inherent attw node16
      # limitation for their .svelte/.vue/APF type entrypoints — publint still
      # covers them).
      - name: Check packaging
        run: pnpm check-packaging

      # The Node contract, executed: imports the BUILT packages in real Node through
      # the `node` export condition (publint/attw only check the map statically, and
      # the SSR unit test only sees the source entry).
      - name: Check Node import contract
        run: pnpm check:node-import

      # The rest of the mechanical guards.
      #
      # A follow-up audit caught this: `pnpm gate` chains twelve `check:*` scripts and
      # CI ran three of them. So five guards added in this very lot — under a commit
      # titled "the guards that did not bite now bite" — fired only when a human
      # remembered to type `pnpm gate`. A PR deleting the engine wiring, unescaping an
      # attribute, or dropping a documented export went green.
      #
      # Listed individually rather than as `pnpm gate` so a failure names the guard
      # instead of a 20-minute chain, and so the coverage/build steps keep their own
      # jobs.
      - name: Check attribute escaping
        run: pnpm check:attr-escaping

      - name: Check the engine seam has a consumer
        run: pnpm check:engine-consumer

      - name: Check every export is documented or exempt
        run: pnpm check:export-mentions

      - name: Check the SSR barrel carries every type
        run: pnpm check:node-barrel-types

      - name: Check the entry-point weight contracts
        run: pnpm check:bundle-entries

      - name: Check published READMEs
        run: pnpm check:readmes

      - name: Check wrapper slot parity
        run: pnpm check:wrapper-slots

      - name: Check every element documents an example
        run: pnpm check:examples

      # The seven below were in `pnpm gate` and in NO workflow — five of them guards
      # that bite. The comment at the top of this block already narrated a previous
      # audit finding this exact shape, on a lot titled "the guards that did not bite
      # now bite", and it drifted again anyway. So the list is no longer maintained
      # by hand: `pnpm check:gate-in-ci` (below) diffs this file's `run:` lines
      # against the gate chain and fails on anything missing. A lesson written down
      # and not mechanised is a lesson that gets learned twice.
      - name: Check the lockfile matches every manifest
        run: pnpm check:lockfile

      - name: Check internal peer ranges are literal and bounded
        run: pnpm check:peer-ranges

      - name: Check text-position escaping
        run: pnpm check:text-escaping

      - name: Check crypto.randomUUID stays behind uuid()
        run: pnpm check:secure-context

      - name: Check a segment is stamped in one place
        run: pnpm check:segment-stamp

      - name: Check derived CSS variables re-anchor where a palette changes
        run: pnpm check:derived-vars

      - name: Check the typed event map is honest
        run: pnpm check:event-map

      - name: Check no comment cites code by line number
        run: pnpm check:cross-refs

      - name: Check every gate step runs in a workflow
        run: pnpm check:gate-in-ci

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      # Runs AFTER the coverage gate: it reads coverage/coverage-summary.json.
      - name: Check the coverage floors sit on the measurement
        run: pnpm check:coverage-floors

      # Runs after the build job's artifacts are not available here, so this only
      # asserts freshness for a tree that built in THIS job — which the docs build
      # below performs.
      - name: Check dist is current with src
        run: pnpm build && pnpm check:dist-freshness

      # The documentation, checked rather than assumed.
      #
      # A cold audit found FOUR broken snippets — including the headline
      # `streamRunner: runStreamAgent` composition printed on five pages and a
      # README, which did not typecheck at all. Every one was the direct
      # consequence of nothing ever compiling them: the repo enforced that each
      # element documents an example and that no README imports a removed symbol,
      # and never checked whether the examples RUN.
      - name: Compile the docs' self-contained snippets
        run: pnpm check:doc-snippets

      # The build also runs the four reference generators, so this is what proves
      # they still produce a site — and it is the only place the generated pages
      # exist for the link check below.
      - name: Build the docs site
        run: pnpm --filter @aparte-workspace/docs build

      - name: Check internal links and anchors
        run: pnpm check:doc-links

      # CLAUDE.md requires a changeset for any package with an API or CSS change,
      # and nothing enforced it. In a `fixed` lockstep group a missing changeset does
      # not just skip one version — the whole 15-package train stays put, no Version PR
      # gets opened, and the published `alpha`/`latest` drift away from the
      # source everyone reads. PR-only: a direct push to main has no base to diff.
      - name: Check a changeset accompanies the change
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          # A RELEASE pull request has no changesets left: `pnpm version-packages`
          # consumed them into the per-package CHANGELOGs and the root aggregate, in
          # this very branch. `changeset status` exits 1 when it finds none — which is
          # exactly what makes it a useful guard on a feature PR and a false alarm on
          # a release one.
          #
          # The root CHANGELOG.md is the signal: nothing writes it except
          # `scripts/gen-root-changelog.mjs`, which only `pnpm version-packages` runs.
          # If this PR touches it, the versions moved inside it and the changesets are
          # already spent.
          #
          # And a PR that touches no package needs no changeset: a workflow, a script,
          # a docs page, the site. The rule in CLAUDE.md is "any package with an API or
          # CSS change" — this guard used to demand one for a one-line ci.yml change,
          # which is a changeset about nothing.
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          if printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "release PR (root CHANGELOG.md moved) — the changesets were consumed here"
          elif ! printf '%s\n' "$changed" | grep -q '^packages/'; then
            echo "no package changed — no changeset needed"
          else
            pnpm exec changeset status --since="origin/${{ github.base_ref }}"
          fi

  # Portability guard for the ONE claim nothing else checks: engines.node ">=18".
  #
  # This was four jobs — Node 18, 20 and 22 on ubuntu plus Node 22 on Windows — and
  # across the three CI runs of the release that first exercised them, all four
  # passed every time while the two jobs beside them found three real breakages.
  # Thirty minutes of compute per push, finding nothing, because three of the four
  # were already covered:
  #
  #   - Node 24 on Linux: the `ci` job above runs the whole gate on it.
  #   - Windows: the maintainer develops on Windows, on Node 24, continuously. A
  #     Windows-only break reaches him before it reaches a runner.
  #   - Node 20 and 22: between a floor that is tested and a ceiling that is tested.
  #     Not nothing, but the thinnest band imaginable.
  #
  # What is left is the floor, and it is not theoretical: `check:node-import` is
  # the only thing that resolves the published `node` export condition in a real
  # Node — publint/attw read the map statically and the unit suite runs under jsdom —
  # and on 18, `Request`, `ReadableStream` and `structuredClone` are genuinely not
  # the same surface. Test the promise, not the interpolation.
  #
  # Add a version back the day a break is found in that band, with the break named.
  node-floor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      # The FLOOR of engines.node. Bump both together, or the promise drifts from
      # what is tested.
      - name: Use Node.js 18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Everything EXCEPT the docs site. This job exists to test the `engines.node: ">=18"`
      # promise of the PUBLISHED packages; `apps/docs` is private and makes no such claim,
      # and since the Astro 7 upgrade it requires Node 22. Building it here would only
      # prove that a private app does not run on a floor it never advertised — and would
      # fail the one job whose whole point is a different question.
      - name: Build
        run: pnpm build --exclude @aparte-workspace/docs

      - name: Test
        run: pnpm test

      # The packages declare `engines.node: ">=18"`, and the Node import contract is
      # the ONLY thing that resolves the published `node` export condition in real
      # Node — publint/attw check the map statically, and the unit test runs under
      # jsdom against the source entry. It used to run once, on the newest Node in
      # the `ci` job, so the `>=18` claim was untested on 18: `Request`,
      # `ReadableStream` and `structuredClone` are not the same surface there.
      - name: Check Node import contract
        run: pnpm check:node-import

  # Does this diff touch anything a browser could notice?
  #
  # Its own job, on a plain runner, and that is the whole point: the `e2e` job below
  # runs INSIDE the Playwright container, where `actions/checkout` has no git and falls
  # back to downloading a tarball — no `.git` at all. The first version of this asked
  # `git diff` there, got "Not a git repository", swallowed it with `|| true`, read the
  # empty result as "nothing changed" and skipped the browser suite on a pull request
  # full of source. It reported green in 33 seconds. Failing open was the intent and
  # the opposite is what shipped, so the check is now explicit rather than implied.
  #
  # What it buys: a release's Version PR is ~113 files and not one of them is source —
  # package versions, CHANGELOGs, and the changesets they consumed. Running seven
  # example apps in three engines to prove a version number does not break a chat is
  # ten minutes, twice per release.
  scope:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.decide.outputs.source }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The diff needs both sides.
          fetch-depth: 0

      - id: decide
        run: |
          run_everything() {
            echo "$1"
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            run_everything "no base to compare against"
          fi

          # `if !` on each command, not `|| true`: a diff that FAILS and a diff that
          # finds nothing produce the same empty string, and telling them apart is the
          # difference between failing open and failing shut.
          if ! files=$(git diff --name-only "$base"...HEAD); then
            run_everything "the file diff failed"
          fi
          if ! manifests=$(git diff -U0 "$base"...HEAD -- '*package.json'); then
            run_everything "the manifest diff failed"
          fi

          other=$(printf '%s\n' "$files" | grep -vE '^\.changeset/|(^|/)CHANGELOG\.md$|(^|/)package\.json$' || true)
          # A manifest can carry a real change too — a dependency, an exports map. Only a
          # version bump and the internal peer floors `sync-peer-ranges` moves are inert.
          real=$(printf '%s\n' "$manifests" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
            | grep -vE '"version":|"@aparte/[^"]+": ">=' || true)

          if [ -n "$other" ] || [ -n "$real" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            echo "source files changed — running the browser suite"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
            echo "versions, changelogs and changesets only — the browser suite has nothing new to see"
          fi
  # Browser smoke E2E — drives every example in a real browser against a
  # network-mocked model (no key/LM Studio). Separate job: it boots six dev
  # servers + a browser, so it is heavier and isolated from the fast gate above.
  e2e:
    needs: scope
    runs-on: ubuntu-latest
    # Runs INSIDE Playwright's own image: the browsers and the system libraries
    # WebKit needs are already there, so this job stops apt-getting them on every
    # run. That step cost 0.9 min on a good day, 3.2 min on a worse one, and 20+
    # when the Azure Ubuntu mirror refuses the request (`Ign:` lines in the log) and
    # apt falls back to archive.ubuntu.com. None of it was cacheable: browser
    # binaries could be, but system packages install into the runner's OS, which is
    # thrown away after every job.
    #
    # The tag MUST track `@playwright/test` in pnpm-lock.yaml (1.61.1 today). A
    # mismatch fails loudly on the first launch ("Executable doesn't exist"), never
    # silently — but bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    # Firefox refuses to launch when $HOME is not owned by the current user, which is
    # the case inside this container. Playwright says so itself, in the failure:
    # "Workaround: Set the HOME=/root environment variable". Chromium and WebKit do not
    # care, which is why the Firefox projects were the only ones failing — in 2ms, before
    # a single page loaded.
    #
    # Firefox joined the matrix locally and this job never ran it: the repo had no pull
    # request until 0.8.0, so its first CI run was also the first run of the Firefox
    # projects.
    env:
      HOME: /root
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        if: needs.scope.outputs.source == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Use Node.js
        if: needs.scope.outputs.source == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: needs.scope.outputs.source == 'true'
        run: pnpm install --frozen-lockfile

      # vanilla-dist consumes @aparte/core from its dist, so the packages must be
      # built before the E2E dev servers boot.
      - name: Build
        if: needs.scope.outputs.source == 'true'
        run: pnpm build

      - name: Browser smoke E2E
        if: needs.scope.outputs.source == 'true'
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() && needs.scope.outputs.source == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
