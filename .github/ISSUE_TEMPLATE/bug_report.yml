name: Bug report
description: Something renders or behaves wrong
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: "@aparte/* version"
      description: All packages ship at one version — `npm ls @aparte/core` tells you.
      placeholder: "0.15.0"
    validations: { required: true }
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: ["Vanilla (custom elements)", "React", "Vue", "Svelte", "Angular", "Node/SSR", "Docs site"]
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        A snippet or repo that shows it. The fastest path: start from an example in
        `apps/examples/` and describe the change that breaks it.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected, what happened instead
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Browser / runtime
      placeholder: "Chrome 132 / Node 22 / Vite 6"
