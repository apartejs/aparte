packages:
  # Core (zero-dep web components) + agnostic agent engine
  - 'packages/core'
  - 'packages/engine'

  # Locales, LLM providers, blessed plugins, framework wrappers
  - 'packages/locales/*'
  - 'packages/providers/*/*'
  - 'packages/plugins/*'
  - 'packages/wrappers/*'

  # What puts the pieces together for one product's users: n8n's chat widget, drawn by aparté

  # Tools around the library, not in it: the docs as an MCP server
  - 'packages/tools/*'

  # Apps: docs (Starlight), examples (one runnable example per framework)
  - 'apps/*'
  - 'apps/examples/*'

  # Browser smoke E2E (Playwright) — drives the examples in a real browser
  - 'e2e'

  # One server-rendered page per meta-framework (Next, Nuxt, SvelteKit, Angular SSR), built and
  # started for real by `pnpm e2e:ssr`. Their scripts are `ssr:*`, never `build`, so neither
  # `pnpm build` nor the gate builds them.
  - 'e2e/ssr/*'
