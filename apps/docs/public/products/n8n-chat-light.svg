<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="aparté chat for n8n">
  <!-- The mark of aparté chat for n8n, in aparté's family (the face ' . ' on aparté's ground, a product's own
       attribute forming its brackets): two workflow nodes whose wires close into [ ] around the face, the chat in
       the middle of the workflow, in n8n's pink (#EA4B71, read on n8n's own logo). Dark by default; the device's
       light scheme turns it light, as the site does. The one source: the header shows this file, and the README's
       PNGs (apartejs/n8n-chat, docs/logo-*.png) are rendered from it. -->
  <title>aparté chat for n8n</title>
  <!-- Derived from n8n-chat-site/public/favicon.svg: its device-scheme switch removed, so the products page shows the one that matches its own theme. -->
  <style>
    .ground { fill: #f6f2ea; }
    .face { fill: #b07d33; }
    .node { fill: #d93d63; }
    .wire { stroke: #d93d63; }
  </style>
  <rect class="ground" width="128" height="128" rx="28" fill="#17141c"/>
  <rect class="node" x="8" y="53" width="20" height="20" rx="6" fill="#ea4b71"/>
  <rect class="node" x="100" y="53" width="20" height="20" rx="6" fill="#ea4b71"/>
  <path class="wire" d="M28 63 H39" fill="none" stroke="#ea4b71" stroke-width="5" stroke-linecap="round"/>
  <path class="wire" d="M89 63 H100" fill="none" stroke="#ea4b71" stroke-width="5" stroke-linecap="round"/>
  <path class="wire" d="M48 42 H39 V84 H48" fill="none" stroke="#ea4b71" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="wire" d="M80 42 H89 V84 H80" fill="none" stroke="#ea4b71" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="face" x="64" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="38" text-anchor="middle" fill="#e7c588">'.'</text>
</svg>
