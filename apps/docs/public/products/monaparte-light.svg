<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The mascot at home, by day: monaparte's icons/mascotte.svg in its light tokens (src/styles.scss: the
       house in #a21caf, the mascot in brass #b07d33 with #241f2b eyes, aparté's light ground). No stars by day. -->
  <defs>
    <linearGradient id="walls" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e90066"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <radialGradient id="light" cx="60" cy="52" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b07d33" stop-opacity=".3"/>
      <stop offset="1" stop-color="#b07d33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground">
      <stop offset="0" stop-color="#a21caf" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a21caf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inside"><path d="M60 4 L112 34 L112 84 L48 84 L30 100 L30 84 L8 84 L8 34 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#f6f2ea"/>
  <ellipse cx="256" cy="390" rx="174" ry="21" fill="url(#ground)"/>
  <g transform="translate(76 70) scale(3)">
    <path d="M60 4 L112 34 L112 84 L48 84 L30 100 L30 84 L8 84 L8 34 Z" fill="#fffdf8"/>
    <rect width="120" height="100" fill="url(#light)" clip-path="url(#inside)"/>
    <path d="M60 4 L112 34 L112 84 L48 84 L30 100 L30 84 L8 84 L8 34 Z" fill="none" stroke="url(#walls)" stroke-width="4" stroke-linejoin="round"/>
    <text x="60" y="71" font-family="Georgia, 'Times New Roman', serif" font-size="40" text-anchor="middle" fill="#b07d33">(<tspan fill="#241f2b">'.'</tspan>)</text>
  </g>
</svg>
