<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aparté · vanilla-dist</title>
    <!-- Render-blocking, like the vanilla example: this document's shell is static
         HTML, so a stylesheet injected after the module graph loads paints unstyled
         first. `style.css` @imports core's theme. -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">aparté <span>· vanilla-dist</span></div>
        <p class="hint">
          Proof the published <code>@aparte/core</code> works standalone — no framework, no build magic,
          resolved through its <code>exports</code> map like any consumer. Type <b>delete</b> to trigger a
          human-in-the-loop tool approval.
        </p>
      </header>
      <aparte-chat center-empty placeholder="Type a message… (try &ldquo;delete&rdquo;)"></aparte-chat>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
