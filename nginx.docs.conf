# nginx config for the Starlight docs behind Coolify's TLS-terminating proxy.
# Replaces the stock /etc/nginx/conf.d/default.conf (see Dockerfile.docs).
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Every text response says its encoding. Without it, text/plain (llms.txt,
    # llms-full.txt, the _llms-txt/ set) carried no charset and a Latin-1-defaulting
    # reader rendered UTF-8 bytes as mojibake — the site title read "aparté" in the
    # very files written for machine readers. text/plain is in nginx's default
    # charset_types, so the one directive covers them.
    charset utf-8;

    # nginx sits behind Coolify's reverse proxy, which terminates TLS. Left to its
    # defaults, nginx builds the directory "add trailing slash" redirect as an
    # ABSOLUTE url and guesses the scheme as http:// — downgrading https -> http.
    # Lenient browsers follow the extra proxy re-upgrade hop, but strict clients
    # (crawlers, link-preview bots, LLM doc fetchers) refuse the https->http
    # downgrade and report "too many redirects". Emitting a RELATIVE Location keeps
    # the caller's original https scheme: one clean hop to the canonical URL.
    absolute_redirect off;
    port_in_redirect  off;

    # Security headers. The site hosts a LIVE showcase that renders chat content,
    # so this is also the honest dogfood of the library's own threat model: a
    # rendering library that ships a sanitizer should be willing to run behind a
    # CSP itself.
    #
    # `always` matters — without it nginx drops these on error responses (404 is a
    # real page here, see error_page below).
    #
    # The CSP is deliberately readable rather than minimal:
    #   - 'unsafe-inline' for style is required by Astro/Starlight's inlined
    #     critical CSS and by the components' own getStyles() blocks.
    #   - 'unsafe-inline' for script is required by Starlight's inline theme
    #     bootstrap (it sets the colour scheme before first paint to avoid a
    #     flash). Removing it needs per-build nonces, which the static export has
    #     no way to emit — worth revisiting if the docs ever gain a server.
    #   - ONE external host: analytics.paulrichez.fr, the self-hosted Umami. It needs
    #     BOTH `script-src` (to fetch /script.js) and `connect-src` (the beacon POSTs
    #     to /api/send) — allow only the first and the script loads, then records
    #     nothing, with no sign of it outside the visitor's own console. The host is
    #     written a second time in apps/docs/src/data/analytics.ts, which is where the
    #     tag itself comes from: the two move together.
    #   - 'wasm-unsafe-eval' — Pagefind, Starlight's own search. It ships the index
    #     reader as a WebAssembly module, and WebAssembly.instantiate is refused by a
    #     CSP unless script-src carries this (the WASM-only allowance; full
    #     'unsafe-eval' stays out). Without it the search box renders, accepts input
    #     and finds NOTHING, with one CompileError in the visitor's console — dev
    #     never shows it, because these headers exist only behind the proxy.
    #   - Nothing else external. Checked against the BUILT site, not the source: the
    #     remaining absolute urls in the output are links (apartejs.dev, github.com,
    #     npmjs.com), and there is no webfont or CDN request — so naming font hosts
    #     here would be declaring an allowance nothing uses.
    #   - frame-ancestors 'self', NOT 'none' — this site frames ITSELF. Every live
    #     preview on the docs is an <iframe> pointing at /preview/*, which is the whole
    #     mechanism: a separate document per example, so core's light DOM is not restyled
    #     by the site around it and a responsive frame has a viewport of its own. With
    #     'none' the child refused to be embedded by anybody, its own parent included, and
    #     every preview in production showed "apartejs.dev refused to connect" — while the
    #     same page framed fine in dev, where no proxy adds these headers. The two halves
    #     of the policy disagreed: 'frame-src self' let the parent embed, 'frame-ancestors
    #     none' forbade the child from being embedded. Clickjacking from ANOTHER origin is
    #     still refused, which is what the header is for.
    #   - X-Frame-Options SAMEORIGIN says the same thing to browsers too old for
    #     frame-ancestors. DENY there would re-break exactly what the line above fixes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://analytics.paulrichez.fr; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://analytics.paulrichez.fr; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Starlight emits a static 404.html at the site root.
    error_page 404 /404.html;
}
