# nginx config for the Starlight docs behind Coolify's TLS-terminating proxy.
# Replaces the stock /etc/nginx/conf.d/default.conf (see Dockerfile.docs).
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # nginx sits behind Coolify's reverse proxy, which terminates TLS. Left to its
    # defaults, nginx builds the directory "add trailing slash" redirect as an
    # ABSOLUTE url and guesses the scheme as http:// — downgrading https -> http.
    # Lenient browsers follow the extra proxy re-upgrade hop, but strict clients
    # (crawlers, link-preview bots, LLM doc fetchers) refuse the https->http
    # downgrade and report "too many redirects". Emitting a RELATIVE Location keeps
    # the caller's original https scheme: one clean hop to the canonical URL.
    absolute_redirect off;
    port_in_redirect  off;

    # Security headers. The site hosts a LIVE showcase that renders chat content,
    # so this is also the honest dogfood of the library's own threat model: a
    # rendering library that ships a sanitizer should be willing to run behind a
    # CSP itself.
    #
    # `always` matters — without it nginx drops these on error responses (404 is a
    # real page here, see error_page below).
    #
    # The CSP is deliberately readable rather than minimal:
    #   - 'unsafe-inline' for style is required by Astro/Starlight's inlined
    #     critical CSS and by the components' own getStyles() blocks.
    #   - 'unsafe-inline' for script is required by Starlight's inline theme
    #     bootstrap (it sets the colour scheme before first paint to avoid a
    #     flash). Removing it needs per-build nonces, which the static export has
    #     no way to emit — worth revisiting if the docs ever gain a server.
    #   - No external host is allowed. Checked against the BUILT site, not the
    #     source: the only absolute urls in the output are links (apartejs.dev,
    #     github.com, npmjs.com), and there is no webfont or CDN request — so
    #     naming font hosts here would be declaring an allowance nothing uses.
    #   - frame-ancestors 'none' replaces X-Frame-Options for modern browsers; the
    #     header is kept for the ones that only understand it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Starlight emits a static 404.html at the site root.
    error_page 404 /404.html;
}
